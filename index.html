<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio A - Personajes de Harry Potter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h1 class="mb-4">Personajes de Harry Potter</h1>

    <div class="row g-3 mb-3">
        <div class="col-md-8">
            <input id="txtBuscarPersonaje" type="search" class="form-control" placeholder="Buscar por nombre, casa, varita, patronus...">
        </div>
        <div class="col-md-4">
            <select id="selCasaHogwarts" class="form-select">
                <option value="">Todas las casas</option>
                <option value="Gryffindor">Gryffindor</option>
                <option value="Hufflepuff">Hufflepuff</option>
                <option value="Ravenclaw">Ravenclaw</option>
                <option value="Slytherin">Slytherin</option>
            </select>
        </div>
    </div>

    <p id="textoResultado"></p>
    <div id="listaPersonajes" class="row g-3"></div>
</div>

<script src="app.js"></script>
</body>
</html>
